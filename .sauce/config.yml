apiVersion: v1alpha
kind: playwright-cucumberjs

sauce:
  region: us-west-1
  concurrency: 1
  metadata:
    build: "$BUILD_ID"

metadata:
  build: "$BUILD_ID"

playwright:
  version: 1.52.0

suites:
  - name: "web-desktop"
    browserName: chromium
    platformName: "Windows 11"
    # Use the 'options' block exactly as shown in the official docs
    options:
      paths:
        - "src/features/**/*.feature"
      require:
        - "src/support/hooks.ts"
        - "src/support/world.ts"
        - "src/features/**/*.ts"
      # This replaces your 'command' and uses your config file logic
      format:
        - "progress"
    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: desktop
      BASE_URL: ${BASE_URL}

  - name: web-responsive
    browserName: chromium
    platformName: "Windows 11"
    options:
      paths:
        - "src/features/**/*.feature"
      require:
        - "src/support/hooks.ts"
        - "src/support/world.ts"
        - "src/features/**/*.ts"
    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: responsive
      BASE_URL: ${BASE_URL}
