apiVersion: v1alpha
kind: playwright
sauce:
  region: us-west-1 # Ensure this is a literal string (us-west-1 or eu-central-1)
  concurrency: 10
  # Fixed metadata syntax:
  name: "Cucumber Playwright Sauce Run" 
  build: "build-${GITHUB_RUN_NUMBER}"

playwright:
  # Fixed: Using a version supported by Sauce Labs as per your error log
  version: "1.49.1" 

# Config for artifact handling
artifacts:
  download:
    when: always
    match:
      - "*"
    directory: ./artifacts

suites:
  - name: web-desktop
    testMatch: ["**/*.feature"] 
    platformName: "Windows 11"
    params:
      browserName: "chromium"
    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: desktop
      BASE_URL: ${BASE_URL}
      HEADLESS: "true"
      LOG_LEVEL: info

  - name: web-responsive
    testMatch: ["**/*.feature"]
    platformName: "Windows 11"
    params:
      browserName: "chromium"
    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: responsive
      BASE_URL: ${BASE_URL}
      HEADLESS: "true"
      LOG_LEVEL: info