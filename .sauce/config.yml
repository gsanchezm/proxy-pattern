apiVersion: v1alpha
kind: playwright-cucumberjs

metadata:
  build: "$BUILD_ID"

playwright:
  version: 1.52.0

suites:
  - name: web-desktop
    browserName: chromium
    platformName: Windows 11

    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: desktop
      BASE_URL: ${BASE_URL}

    command: >
      pnpm test

  - name: web-responsive
    browserName: chromium
    platformName: Windows 11

    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: responsive
      BASE_URL: ${BASE_URL}

    command: >
      pnpm test
