apiVersion: v1alpha
kind: playwright
sauce:
  region: us-west-1 # Must be hardcoded: us-west-1 or eu-central-1
  concurrency: 10
  metadata:
    name: "Cucumber Playwright Sauce Run"
    build: "build-${GITHUB_RUN_NUMBER}"

playwright:
  version: 1.40.0 # Match your package.json version

# This handles artifact downloading automatically
artifacts:
  download:
    when: always
    match:
      - "*"
    directory: ./artifacts

suites:
  - name: web-desktop
    testMatch: ["**/*.feature"] # Targets your Cucumber feature files
    platformName: "Windows 11"
    params:
      browserName: "chromium"
    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: desktop
      BASE_URL: ${BASE_URL}
      HEADLESS: "true"
      LOG_LEVEL: info

  - name: web-responsive
    testMatch: ["**/*.feature"]
    platformName: "Windows 11"
    params:
      browserName: "chromium"
    env:
      PLATFORM: web
      DRIVER: playwright
      VIEWPORT: responsive
      BASE_URL: ${BASE_URL}
      HEADLESS: "true"
      LOG_LEVEL: info