name: Sauce Matrix - All Features

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  web:
    name: Web (Playwright on Sauce) - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    environment: PROXY_ENV
    strategy:
      fail-fast: false
      matrix:
        viewport: [ desktop, responsive ]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Validate required secrets
        run: |
          for v in SAUCE_USERNAME SAUCE_ACCESS_KEY SAUCE_REGION BASE_URL; do
            if [ -z "${!v}" ]; then
              echo "$v is empty. Add it to GitHub Environment PROXY_ENV secrets."
              exit 1
            fi
          done
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ secrets.SAUCE_REGION }}
          BASE_URL: ${{ secrets.BASE_URL }}

      # ✅ NEW: Create directories before saucectl runs
      - name: Create artifact directories
        run: mkdir -p logs metrics

      # ✅ NEW: Official Sauce Labs Action
      - name: Run ALL features (web on Sauce)
        uses: saucelabs/saucectl-run-action@v4
        env:
          # Pass your custom environment variables here so saucectl
          # can inject them into your tests/.sauce/config.yml
          GITHUB_TOKEN: $ {{ secrets.GITHUB_TOKEN }}
          LOG_FILE: "logs/all-web-${{ matrix.viewport }}.jsonl"
          PLATFORM: web
          DRIVER: playwright
          VIEWPORT: ${{ matrix.viewport }}
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: true
          LOG_LEVEL: info
        with:
          sauce-username: ${{ secrets.SAUCE_USERNAME }}
          sauce-access-key: ${{ secrets.SAUCE_ACCESS_KEY }}
          region: ${{ secrets.SAUCE_REGION }}
          select-suite: "web-${{ matrix.viewport }}"

      - name: Generate metrics
        if: always()
        run: |
          pnpm metrics:collect
          pnpm metrics:exec
          pnpm metrics:failures
          pnpm metrics:flaky

      - name: Upload artifacts (logs + metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-web-${{ matrix.viewport }}
          path: |
            logs/
            metrics/
            .sauce/

  # Mobile job remains unchanged as it uses Appium/WDIO directly, not saucectl
  mobile:
    name: Mobile (Appium on Sauce) - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    environment: PROXY_ENV
    strategy:
      fail-fast: false
      matrix:
        platform: [ android, ios ]
        include:
          - platform: android
            cap_profile: google_pixel_5
          - platform: ios
            cap_profile: iphone_13_pro

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate Sauce secrets
        run: |
          for v in SAUCE_USERNAME SAUCE_ACCESS_KEY SAUCE_REGION; do
            if [ -z "${!v}" ]; then
              echo "$v is empty. Add it to GitHub Environment PROXY_ENV secrets."
              exit 1
            fi
          done
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ secrets.SAUCE_REGION }}

      - name: Run ALL features (mobile on Sauce)
        run: |
          mkdir -p logs metrics

          LOG_FILE="logs/all-${{ matrix.platform }}.jsonl" \
          SAUCE=true \
          SAUCE_REGION="${{ secrets.SAUCE_REGION }}" \
          SAUCE_USERNAME="${{ secrets.SAUCE_USERNAME }}" \
          SAUCE_ACCESS_KEY="${{ secrets.SAUCE_ACCESS_KEY }}" \
          SAUCE_BUILD="proxy-pattern-${GITHUB_RUN_NUMBER}" \
          SAUCE_TEST_NAME="all-features-${{ matrix.platform }}" \
          SAUCE_ANDROID_APP="storage:filename=mda-2.2.0-25.apk" \
          SAUCE_IOS_APP="storage:filename=SauceLabs-Demo-App.ipa" \
          CAP_PROFILE="${{ matrix.cap_profile }}" \
          pnpm test:${{ matrix.platform }}
        env:
          WDIO_CONN_RETRY_TIMEOUT: "180000"
          WDIO_CONN_RETRY_COUNT: "3"
          WDIO_LOG_LEVEL: "error"

      - name: Generate metrics
        if: always()
        run: |
          pnpm metrics:collect
          pnpm metrics:exec
          pnpm metrics:failures
          pnpm metrics:flaky

      - name: Upload artifacts (logs + metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-mobile-${{ matrix.platform }}
          path: |
            logs/
            metrics/