name: Sauce Matrix - All Features

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  upload-apps:
    name: Upload apps to Sauce Storage
    runs-on: ubuntu-latest
    outputs:
      android_filename: ${{ steps.names.outputs.android_filename }}
      ios_filename: ${{ steps.names.outputs.ios_filename }}
    steps:
      - uses: actions/checkout@v4

      - id: names
        run: |
          echo "android_filename=mda-2.2.0-25.apk" >> $GITHUB_OUTPUT
          echo "ios_filename=SauceLabs-Demo-App.ipa" >> $GITHUB_OUTPUT

      # Upload Android APK
      - name: Upload Android app
        run: |
          curl -u "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" --location \
            --request POST "https://api.${SAUCE_REGION}.saucelabs.com/v1/storage/upload" \
            --form "payload=@assets/apps/android/mda-2.2.0-25.apk" \
            --form "name=mda-2.2.0-25.apk"
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ secrets.SAUCE_REGION }}

      # Upload iOS IPA
      - name: Upload iOS app
        run: |
          curl -u "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" --location \
            --request POST "https://api.${SAUCE_REGION}.saucelabs.com/v1/storage/upload" \
            --form "payload=@assets/apps/ios/SauceLabs-Demo-App.ipa" \
            --form "name=SauceLabs-Demo-App.ipa"
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ secrets.SAUCE_REGION }}

  web:
    name: Web (Playwright) - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: [ desktop, responsive ]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run ALL features (web)
        run: |
          mkdir -p logs metrics
          LOG_FILE="logs/all-web-${{ matrix.viewport }}.jsonl" pnpm test:web:${{ matrix.viewport }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: "true"
          LOG_LEVEL: "info"

      - name: Generate metrics
        if: always()
        run: |
          pnpm metrics:collect
          pnpm metrics:exec
          pnpm metrics:failures
          pnpm metrics:flaky

      - name: Upload artifacts (logs + metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-web-${{ matrix.viewport }}
          path: |
            logs/
            metrics/

  mobile:
    name: Mobile (Appium on Sauce) - ${{ matrix.platform }}
    needs: upload-apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ android, ios ]
        include:
          - platform: android
            cap_profile: galaxy_s25_ultra
          - platform: ios
            cap_profile: iphone_16_pro

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run ALL features (mobile on Sauce)
        run: |
          mkdir -p logs metrics
          LOG_FILE="logs/all-${{ matrix.platform }}.jsonl" \
          SAUCE=true \
          SAUCE_REGION="${SAUCE_REGION}" \
          SAUCE_BUILD="proxy-pattern-${GITHUB_RUN_NUMBER}" \
          SAUCE_TEST_NAME="all-features-${{ matrix.platform }}" \
          SAUCE_ANDROID_APP="storage:filename=${ANDROID_FILE}" \
          SAUCE_IOS_APP="storage:filename=${IOS_FILE}" \
          CAP_PROFILE="${{ matrix.cap_profile }}" \
          pnpm test:${{ matrix.platform }}
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: ${{ secrets.SAUCE_REGION }}
          ANDROID_FILE: ${{ needs.upload-apps.outputs.android_filename }}
          IOS_FILE: ${{ needs.upload-apps.outputs.ios_filename }}

          WDIO_CONN_RETRY_TIMEOUT: "180000"
          WDIO_CONN_RETRY_COUNT: "3"
          WDIO_LOG_LEVEL: "error"

      - name: Generate metrics
        if: always()
        run: |
          pnpm metrics:collect
          pnpm metrics:exec
          pnpm metrics:failures
          pnpm metrics:flaky

      - name: Upload artifacts (logs + metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-mobile-${{ matrix.platform }}
          path: |
            logs/
            metrics/